name: Tests & Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin_db
          POSTGRES_PASSWORD: password_seguro
          POSTGRES_DB: inventario_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar tests con pytest
        env:
          DATABASE_URL: postgresql://admin_db:password_seguro@localhost:5432/inventario_db
        run: |
          pytest test_app.py -v --tb=short

      - name: Validar type hints con mypy
        run: |
          mypy app.py validators.py database.py --ignore-missing-imports || true

      - name: Ejecutar linter (pylint)
        run: |
          pylint app.py --fail-under=7.0 || true

      - name: Generar reporte de cobertura
        run: |
          pip install pytest-cov
          pytest test_app.py --cov=. --cov-report=xml --cov-report=term || true

      - name: Subir reporte de cobertura
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
